<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7B2FF7">
  <title>ChapaShop — панель владельца</title>
  <!-- Шрифт Manrope. Если Google Fonts недоступен, сработает системный шрифт. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <!-- Версию ?v=… к этим двум ссылкам добавляет сам сервер (main.py), руками менять не нужно. -->
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <!-- Пока идёт проверка входа, показываем только крутилку -->
  <div id="boot" class="boot"><div class="spin"></div></div>

  <!-- ===== ФОРМА ВХОДА: после успешного входа полностью скрывается ===== -->
  <section id="login" class="login hidden" aria-label="Вход">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-logo">★</div>
      <h1>Chapa<span>Shop</span></h1>
      <p class="muted">Панель владельца</p>
      <label class="fld">Логин
        <input name="username" autocomplete="username" required maxlength="64" autocapitalize="off" spellcheck="false">
      </label>
      <label class="fld">Пароль
        <input name="password" type="password" autocomplete="current-password" required maxlength="128">
      </label>
      <button class="btn lg" id="loginBtn">Войти</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>

  <!-- ===== ПАНЕЛЬ ===== -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="top-row">
        <div class="logo"><i>★</i>Chapa<span>Shop</span><small>админ</small></div>
        <button id="logout" class="btn ghost sm">Выйти</button>
      </div>
      <!-- Вкладки: переключаются без перезагрузки страницы (адрес меняется только после #) -->
      <nav id="tabs" aria-label="Разделы">
        <a data-tab="dash" href="#dash">Сводка</a>
        <a data-tab="orders" href="#orders">Заказы</a>
        <a data-tab="products" href="#products">Товары</a>
        <a data-tab="promos" href="#promos">Промокоды</a>
        <a data-tab="requests" href="#requests">Заявки</a>
        <a data-tab="customers" href="#customers">Покупатели</a>
        <a data-tab="settings" href="#settings">Настройки</a>
        <a data-tab="audit" href="#audit">Журнал</a>
        <a data-tab="backup" href="#backup">Копии</a>
      </nav>
    </header>
    <main id="view"></main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/admin.js"></script>
</body>
</html>
